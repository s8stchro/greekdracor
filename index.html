<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek DraCor Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #network-graph { height: 600px; width: 100%; }
        .metric-card { text-align: center; padding: 20px; }
        .metric-value { font-size: 2rem; font-weight: bold; color: #0d6efd; }
        .metric-label { font-size: 0.9rem; color: #6c757d; text-transform: uppercase; }
        #play-selector { max-width: 400px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Greek DraCor Replica Dashboard</span>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Select a Play</h5>
                    <select id="play-selector" class="form-select">
                        <option value="">Loading plays...</option>
                    </select>
                    <hr>
                    <div id="play-metadata">
                        <p><strong>Author:</strong> <span id="meta-author">-</span></p>
                        <p><strong>Title:</strong> <span id="meta-title">-</span></p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Network Metrics</h5>
                        <div class="metric-card border-bottom">
                            <div id="val-nodes" class="metric-value">0</div>
                            <div class="metric-label">Nodes</div>
                        </div>
                        <div class="metric-card border-bottom">
                            <div id="val-edges" class="metric-value">0</div>
                            <div class="metric-label">Edges</div>
                        </div>
                        <div class="metric-card border-bottom">
                            <div id="val-density" class="metric-value">0</div>
                            <div class="metric-label">Density</div>
                        </div>
                        <div class="metric-card">
                            <div id="val-clustering" class="metric-value">0</div>
                            <div class="metric-label">Clustering</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-white">
                                <h5 class="mb-0">Network Graph</h5>
                            </div>
                            <div class="card-body p-0">
                                <div id="network-graph"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header bg-white">
                                <h5 class="mb-0">Character Centrality</h5>
                            </div>
                            <div class="card-body">
                                <div id="centrality-chart"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
